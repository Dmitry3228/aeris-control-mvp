name: aeris-control-test

services:
  mosquitto:
    image: eclipse-mosquitto:2.0.20
    volumes:
      - ./mosquitto.test.conf:/mosquitto/config/mosquitto.conf:ro
    healthcheck:
      test: ["CMD", "mosquitto_pub", "-h", "localhost", "-t", "aeris/health", "-m", "ping"]
      interval: 2s
      timeout: 2s
      retries: 15

  clickhouse:
    image: clickhouse/clickhouse-server:24.8.14.39-alpine
    environment:
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: aeris-test
    ports:
      - "127.0.0.1:${AERIS_TEST_CLICKHOUSE_PORT:-18124}:8123"
    healthcheck:
      test: ["CMD-SHELL", "clickhouse-client --user default --password aeris-test --query 'SELECT 1'"]
      interval: 2s
      timeout: 2s
      retries: 15

  redis:
    image: redis:7.4.2-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 15

  backend-test:
    image: python:3.12.7-slim-bookworm
    profiles: ["test"]
    working_dir: /workspace/backend
    volumes:
      - ./backend:/workspace/backend
    environment:
      AERIS_RUN_INTEGRATION: "1"
      CLICKHOUSE_HOST: clickhouse
      CLICKHOUSE_PORT: "8123"
      CLICKHOUSE_PASSWORD: aeris-test
      REDIS_URL: redis://redis:6379/0
      MQTT_HOST: mosquitto
      MQTT_PORT: "1883"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      PIP_ROOT_USER_ACTION: ignore
    depends_on:
      clickhouse:
        condition: service_healthy
      redis:
        condition: service_healthy
      mosquitto:
        condition: service_healthy
    command: >
      sh -c "python -m pip install -e '.[dev]' && python -m pytest -q"
